<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NeverMiss — Login</title>
<link rel="icon" type="image/png" sizes="32x32" href="/nevermiss-favicon-32.png">
<link rel="apple-touch-icon" href="/nevermiss-apple-touch-icon.png">
<meta name="theme-color" content="#0B2622">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{--ink:#0B2622;--teal:#0F766E;--teal-deep:#0A5A54;--mint:#D9F2EB;--mint-2:#EEF8F5;--paper:#F5F8F7;--line:#DCE5E2;--muted:#557069;--marigold:#E8A33D;--danger:#B42318;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Hind',system-ui,sans-serif;font-size:1rem;line-height:1.5;color:var(--ink);background:var(--paper);min-height:100vh;display:grid;grid-template-columns:1fr 1fr;-webkit-font-smoothing:antialiased;}
  :focus-visible{outline:3px solid var(--marigold);outline-offset:2px;border-radius:6px;}
  .side{background:var(--ink);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
  .side .big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(5rem,10vw,9rem);letter-spacing:-0.06em;line-height:.85;color:#174A44;}
  .side .big small{font-size:.3em;letter-spacing:-0.02em;}
  .side p{color:#A9C7C0;max-width:34ch;font-size:1.05rem;}
  .side .brand{display:flex;align-items:center;gap:.6rem;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.25rem;}
  .side .brand img{width:30px;height:30px;border-radius:8px;}
  main{display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;}
  .card{width:100%;max-width:400px;}
  .logo{display:none;align-items:center;gap:.6rem;margin-bottom:2rem;}
  .logo-icon{width:34px;height:34px;border-radius:9px;}
  .logo-text{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:-0.02em;}
  .logo-text span{color:var(--teal);}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-size:2rem;font-weight:700;letter-spacing:-0.025em;margin-bottom:.3rem;}
  p.sub{color:var(--muted);margin-bottom:1.8rem;}
  label{font-size:.92rem;font-weight:600;display:block;margin-bottom:.35rem;}
  input{width:100%;padding:.8rem .95rem;border:1.5px solid var(--line);border-radius:11px;font-family:inherit;font-size:1rem;color:var(--ink);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;margin-bottom:1.1rem;}
  input:focus{border-color:var(--teal);box-shadow:0 0 0 4px var(--mint-2);}
  .btn{width:100%;padding:.9rem;background:var(--teal);color:#fff;border:none;border-radius:11px;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;transition:background .15s;}
  .btn:hover{background:var(--teal-deep);}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .err{font-size:.93rem;color:var(--danger);background:#FEF3F2;border:1px solid #FECDCA;border-radius:10px;padding:.7rem .9rem;margin-bottom:1rem;display:none;}
  .success{font-size:.93rem;color:var(--teal-deep);background:var(--mint-2);border:1px solid #B9E3D7;border-radius:10px;padding:.7rem .9rem;margin-bottom:1rem;display:none;}
  .footer{text-align:center;font-size:.9rem;color:var(--muted);margin-top:1.6rem;}
  .footer a{color:var(--teal);font-weight:600;text-decoration:none;}
  .forgot-link{display:block;margin:1rem auto 0;font-size:.93rem;color:var(--teal);font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;padding:.2rem;}
  .forgot-link:hover{color:var(--teal-deep);text-decoration:underline;}
  #reset-section{display:none;}
  @media (max-width:820px){body{grid-template-columns:1fr;}.side{display:none;}.logo{display:flex;}}
</style>
</head>
<body>
<aside class="side" aria-hidden="true">
  <div class="brand"><img src="/nevermiss-logo.svg" alt="">NeverMiss</div>
  <div>
    <div class="big">10:47<small>PM</small></div>
    <p>Your bot is answering parents right now. Sign in to see who messaged.</p>
  </div>
</aside>
<main>
<div class="card">
  <div class="logo">
    <img src="/nevermiss-logo.svg" alt="" class="logo-icon">
    <div class="logo-text">Never<span>Miss</span></div>
  </div>

  <!-- Normal sign-in form -->
  <div id="login-section">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your dashboard</p>
    <div class="err" id="err"></div>
    <label>Email</label>
    <input type="email" id="femail" placeholder="you@example.com"/>
    <label>Password</label>
    <input type="password" id="fpass" placeholder="••••••••"/>
    <button class="btn" id="fbtn" onclick="doLogin()">Sign in</button>
    <button class="forgot-link" onclick="showResetSection()">Forgot password?</button>
    <div class="footer">Need access? <a href="https://wa.me/917484849508?text=Hi%2C%20I%20need%20help%20logging%20in%20to%20NeverMiss" target="_blank" rel="noopener">Contact NeverMiss support</a></div>
  </div>

  <!-- NEW: forgot-password form -- toggled in via showResetSection(),
       hidden by default. Uses Supabase's resetPasswordForEmail(), which
       emails a recovery link. That link redirects to set-password.html,
       which already works generically for BOTH invite and password-reset
       links (it just waits for any Supabase session to appear from the
       URL) -- so no changes were needed there. -->
  <div id="reset-section">
    <h1>Reset your password</h1>
    <p class="sub">Enter your email and we'll send you a reset link</p>
    <div class="err" id="reset-err"></div>
    <div class="success" id="reset-success"></div>
    <label>Email</label>
    <input type="email" id="reset-email" placeholder="you@example.com"/>
    <button class="btn" id="reset-btn" onclick="sendResetLink()">Send reset link</button>
    <button class="forgot-link" onclick="showLoginSection()">Back to sign in</button>
  </div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
var _db = supabase.createClient(
  'https://uwxthbxxiaujlgxosqjx.supabase.co',
  'sb_publishable_MLPKMAL2JnseHnh-zyxidA_kwsBirfj'
);

_db.auth.getSession().then(function(r){ if(r.data.session) location.href='dashboard.html'; });

async function doLogin(){
  var email=document.getElementById('femail').value.trim();
  var pass=document.getElementById('fpass').value;
  var btn=document.getElementById('fbtn');
  var err=document.getElementById('err');
  err.style.display='none';
  if(!email||!pass){err.textContent='Please enter email and password.';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='Signing in...';
  var r=await _db.auth.signInWithPassword({email:email,password:pass});
  if(r.error){err.textContent=r.error.message;err.style.display='block';btn.disabled=false;btn.textContent='Sign in';return;}
  location.href='dashboard.html';
}

// NEW: toggles between the sign-in form and the forgot-password form.
// Prefills the reset email field with whatever they already typed in
// the login email field, so they don't have to retype it.
function showResetSection(){
  var loginEmail = document.getElementById('femail').value.trim();
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('reset-section').style.display = 'block';
  document.getElementById('reset-err').style.display = 'none';
  document.getElementById('reset-success').style.display = 'none';
  if (loginEmail) document.getElementById('reset-email').value = loginEmail;
}

function showLoginSection(){
  document.getElementById('reset-section').style.display = 'none';
  document.getElementById('login-section').style.display = 'block';
}

// NEW: sends a Supabase password-recovery email. Deliberately shows the
// same success message whether or not the email actually exists in
// Auth -- Supabase itself doesn't reveal that distinction via the API
// response either, and showing a different message for "email not
// found" would let someone probe which emails have NeverMiss accounts.
async function sendResetLink(){
  var email = document.getElementById('reset-email').value.trim();
  var btn   = document.getElementById('reset-btn');
  var err   = document.getElementById('reset-err');
  var success = document.getElementById('reset-success');
  err.style.display = 'none';
  success.style.display = 'none';

  if (!email) {
    err.textContent = 'Please enter your email.';
    err.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending...';

  var r = await _db.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://nevermiss.co.in/set-password.html'
  });

  btn.disabled = false;
  btn.textContent = 'Send reset link';

  if (r.error) {
    err.textContent = r.error.message;
    err.style.display = 'block';
    return;
  }

  success.textContent = 'If an account exists for that email, a reset link has been sent. Check your inbox.';
  success.style.display = 'block';
}

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    if (document.getElementById('reset-section').style.display === 'block') {
      sendResetLink();
    } else {
      doLogin();
    }
  }
});
</script>
</body>
</html>
